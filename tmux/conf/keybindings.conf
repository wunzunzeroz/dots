# Keybindings -- all prefix and non-prefix binds in one place.

##################################################
# PREFIX

# Unbind default prefix (Ctrl+B)
unbind C-b

# Set prefix to Ctrl+H
set -g prefix C-h
bind C-h send-prefix

##################################################
# CONFIG

# Reload config
bind r source-file ~/.tmux.conf\; display-message "Config reloaded"

##################################################
# SPLITS (open in same directory)

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

##################################################
# PANE NAVIGATION (vim keys)

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##################################################
# PANE RESIZING (vim keys, uppercase, 5-cell increments)

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##################################################
# WINDOWS

# Shift-arrow to switch windows (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

##################################################
# DISPLAY

# Show pane numbers
bind q display-panes

##################################################
# COPY MODE (vi-style + system clipboard)

bind [ copy-mode
bind ] paste-buffer

# In copy mode: v to begin selection, y to yank to clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Mouse drag auto-copies to clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

##################################################
# SESSION MANAGEMENT

# Fuzzy session picker (prefix+Space -- overrides the old next-layout bind)
bind Space display-popup -E -w 60% -h 60% "$HOME/.tmux/scripts/session-picker.sh '#{session_name}'"

# Switch to last session (like `cd -`)
bind \; switch-client -l

# Fuzzy window picker (overrides default `choose-tree -Zw`)
bind w display-popup -E -w 60% -h 60% "$HOME/.tmux/scripts/window-picker.sh"

##################################################
# POPUP TERMINAL

# Floating scratch terminal (80% width/height)
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

##################################################
# CLAUDE
#
# Spawn a named claude-code session.
#   :claw NAME       -> new window named NAME, running `claude --name NAME`
#   :clap NAME       -> new pane with title NAME, running `claude --name NAME`
#   prefix + W / P   -> same, via interactive prompt
#
# Both command-alias and keybind route through command-prompt. The alias
# pre-fills via %1; pressing Enter confirms. A bare `:claw` opens an empty
# prompt.

set -g command-alias[100] 'claw=command-prompt -p "claude window name:" -I "%1" { new-window -c "#{pane_current_path}" -n "%%" "$HOME/.tmux/scripts/claude-pane.sh %%" }'
set -g command-alias[101] 'clap=command-prompt -p "claude pane name:"   -I "%1" { split-window -h -c "#{pane_current_path}" "$HOME/.tmux/scripts/claude-pane.sh %%" }'

bind W command-prompt -p "claude window name:" { new-window -c "#{pane_current_path}" -n "%%" "$HOME/.tmux/scripts/claude-pane.sh %%" }
bind P command-prompt -p "claude pane name:"   { split-window -h -c "#{pane_current_path}" "$HOME/.tmux/scripts/claude-pane.sh %%" }

##################################################
# HQ (personal ops CLI — ~/dev/hq)
#
# Popups over the hq vault. `hq` must be on PATH (npm link).
#   prefix+g  glance: full sitrep board, any key closes
#   prefix+G  complete tasks: fzf picker (TAB marks multiple)
#   prefix+i  capture tasks: nvim buffer, one task per line
#   prefix+e  open today's daily in nvim

# Glance at the board. sitrep exits immediately, so hold the popup
# open until a key is pressed (zsh read -k1).
bind g display-popup -E -w 90% -h 85% "zsh -c 'hq s --all --no-pager; printf \"\\n  [any key to close]\"; read -k1 -s'"

# Complete tasks — hq's own fzf multi-select picker; closes when done.
bind G display-popup -E -w 80% -h 70% "hq d"

# Bulk task capture — bare `hq task` opens $EDITOR, one task per line.
bind i display-popup -E -w 80% -h 70% "hq task"

# Today's daily note in $EDITOR (created if missing).
bind e display-popup -E -w 90% -h 85% "hq today"
